<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baca Acak</title>
<style>
  :root{--bg:#faf7f2;--card:#ffffff;--text:#2b2b2b;--muted:#7a7a7a;--accent:#c4663a;--line:#eadfd3;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#1c1b1a;--card:#262524;--text:#eeeeee;--muted:#a09b95;--accent:#e08a5f;--line:#3a3836;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  h1{margin:0 0 4px;font-size:28px}
  .date{color:var(--muted);margin:0 0 20px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .stat{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .stat span{color:var(--muted);font-size:14px}
  .bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .card.done{opacity:.55}
  .card.done .title{text-decoration:line-through}
  .num{color:var(--muted);font-size:13px;margin-bottom:4px}
  .title{font-size:18px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  a.open{background:var(--accent);color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-family:Arial,sans-serif;font-size:14px}
  label{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:Arial,sans-serif;font-size:14px}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .finish{text-align:center;color:var(--accent);font-size:18px;margin:20px 0}
  .reset{margin-top:36px;text-align:center}
  .reset button{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Baca Acak</h1>
  <p class="date" id="date"></p>
  <div class="stats">
    <div class="stat"><b id="todayCount">0/5</b><span>Hari ini</span><div class="bar"><i id="todayBar"></i></div></div>
    <div class="stat"><b id="totalCount">0/50</b><span id="roundLabel">Putaran 1</span><div class="bar"><i id="totalBar"></i></div></div>
  </div>
  <div id="list"></div>
  <div class="finish" id="finish" style="display:none">Selesai untuk hari ini. Sampai besok!</div>
  <div class="reset"><button id="resetBtn">Reset semua progres</button></div>
</div>

<script>

// ============================================================
// Di bawah ini adalah mesin webnya. Tidak perlu diubah.
// ============================================================
const PER_DAY = 5;
const KEY = "bacaAcak_v1";

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.read)) return s;
  }catch(e){}
  return {read:[], round:1, date:"", picks:[], done:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

let state = load();
const allUrls = STORIES.map(s => s.u);
const byUrl = {};
STORIES.forEach(s => byUrl[s.u] = s);

function pickForToday(){
  state.read = state.read.filter(u => allUrls.includes(u));
  const pool = allUrls.filter(u => !state.read.includes(u));
  let picks = shuffle(pool).slice(0, PER_DAY);
  if(picks.length < PER_DAY){
    // semua cerita sudah dibaca, mulai putaran baru
    state.round++;
    state.read = [];
    const rest = shuffle(allUrls.filter(u => !picks.includes(u)));
    picks = picks.concat(rest.slice(0, PER_DAY - picks.length));
  }
  state.date = todayStr();
  state.picks = picks;
  state.done = [];
  save();
}

function toggle(u, checked){
  if(checked){
    if(!state.done.includes(u)) state.done.push(u);
    if(!state.read.includes(u)) state.read.push(u);
  }else{
    state.done = state.done.filter(x => x !== u);
    state.read = state.read.filter(x => x !== u);
  }
  save();
  render();
}

function render(){
  document.getElementById("date").textContent =
    new Date().toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});

  const total = state.picks.length;
  const doneCount = state.done.filter(u => state.picks.includes(u)).length;
  document.getElementById("todayCount").textContent = doneCount + "/" + total;
  document.getElementById("todayBar").style.width = (total ? doneCount/total*100 : 0) + "%";

  const readCount = state.read.length;
  document.getElementById("totalCount").textContent = readCount + "/" + STORIES.length;
  document.getElementById("totalBar").style.width = (readCount/STORIES.length*100) + "%";
  document.getElementById("roundLabel").textContent = "Putaran " + state.round;

  const list = document.getElementById("list");
  list.innerHTML = "";
  state.picks.forEach((u, i) => {
    const s = byUrl[u];
    if(!s) return;
    const isDone = state.done.includes(u);

    const card = document.createElement("div");
    card.className = "card" + (isDone ? " done" : "");

    const num = document.createElement("div");
    num.className = "num";
    num.textContent = "Cerita " + (i+1);

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = s.t;

    const row = document.createElement("div");
    row.className = "row";

    const a = document.createElement("a");
    a.className = "open";
    a.href = s.u;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = "Buka cerita";

    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = isDone;
    cb.addEventListener("change", () => toggle(u, cb.checked));
    label.appendChild(cb);
    label.appendChild(document.createTextNode("Sudah dibaca"));

    row.appendChild(a);
    row.appendChild(label);
    card.appendChild(num);
    card.appendChild(title);
    card.appendChild(row);
    list.appendChild(card);
  });

  document.getElementById("finish").style.display =
    (total > 0 && doneCount >= total) ? "block" : "none";
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if(confirm("Yakin mau reset semua progres? Ini akan mengosongkan semua ceklis dan mengacak ulang.")){
    state = {read:[], round:1, date:"", picks:[], done:[]};
    pickForToday();
    render();
  }
});

// Jalankan saat halaman dibuka
state.picks = (state.picks || []).filter(u => allUrls.includes(u));
if(state.date !== todayStr() || state.picks.length === 0){
  pickForToday();
}
render();
</script>
</body>
